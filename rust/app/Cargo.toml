[package]
name = "padbridge"
description = "PadBridge: game controllers as MIDI, keyboard/mouse and network gamepads"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
padbridge-core = { path = "../core" }
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.9"
evdev = "0.12"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
core-graphics = { version = "0.23", features = ["highsierra"] }
coremidi = "0.9.2"
hidapi = "2.6"
rusb = { version = "0.9.4", features = ["vendored"] }

[target.'cfg(target_os = "windows")'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
midir = "0.10"
vigem-client = { version = "0.1.4", features = ["unstable_xtarget_notification"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
] }
